<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#000000"/>
  <!-- Audio bars with animation -->
  <rect x="18" y="40" width="10" height="20" rx="5" fill="#3b82f6">
    <animate attributeName="height" values="20; 50; 20" dur="1s" repeatCount="indefinite" />
    <animate attributeName="y" values="40; 25; 40" dur="1s" repeatCount="indefinite" />
  </rect>
  <rect x="34" y="25" width="10" height="50" rx="5" fill="#60a5fa">
    <animate attributeName="height" values="50; 80; 50" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="y" values="25; 10; 25" dur="1.2s" repeatCount="indefinite" />
  </rect>
  <rect x="50" y="10" width="10" height="80" rx="5" fill="#93c5fd">
    <animate attributeName="height" values="80; 30; 80" dur="0.8s" repeatCount="indefinite" />
    <animate attributeName="y" values="10; 35; 10" dur="0.8s" repeatCount="indefinite" />
  </rect>
  <rect x="66" y="30" width="10" height="40" rx="5" fill="#60a5fa">
    <animate attributeName="height" values="40; 60; 40" dur="1.1s" repeatCount="indefinite" />
    <animate attributeName="y" values="30; 20; 30" dur="1.1s" repeatCount="indefinite" />
  </rect>
  <rect x="82" y="45" width="10" height="10" rx="5" fill="#3b82f6">
    <animate attributeName="height" values="10; 30; 10" dur="0.9s" repeatCount="indefinite" />
    <animate attributeName="y" values="45; 35; 45" dur="0.9s" repeatCount="indefinite" />
  </rect>
</svg>